name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak FloatingAI.zip
        run: unzip -q FloatingAI.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: FloatingAI
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingAI-apk
          path: FloatingAI/app/build/outputs/apk/debug/app-debug.apk
